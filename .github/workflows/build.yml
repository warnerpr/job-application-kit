name: Build documents

# Turns resumes and cover letters into .txt, .docx and .pdf, then commits the
# results back to the repository. Run `git pull` afterwards to get them.
# A push rebuilds only the Markdown files it changed; a change to the footer,
# the build scripts or this workflow (or a manual run) rebuilds everything.
on:
  push:
    branches: [main]
    paths:
      - 'master_resume.md'
      - 'public_resume.md'
      - 'applications/**/*.md'
      - 'footer.md'
      - 'scripts/build.sh'
      - 'scripts/wd_txt.py'
      - 'scripts/pdf.css'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of overlapping, so two quick pushes don't collide.
concurrency:
  group: build-documents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build stamps each document with its source's
          # last commit time, and the diff below needs the previous commit.
          fetch-depth: 0

      - name: Install pandoc and weasyprint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc weasyprint fonts-dejavu

      - name: Build
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          everything() { echo "Rebuilding everything: $1"; bash scripts/build.sh; exit 0; }
          [ "$GITHUB_EVENT_NAME" = push ] || everything "manual run"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || everything "no previous commit"
          changed="$(git diff --name-only --diff-filter=d "$BEFORE" HEAD)"
          grep -qxE 'footer\.md|scripts/(build\.sh|wd_txt\.py|pdf\.css)|\.github/workflows/build\.yml' <<<"$changed" &&
            everything "shared build input changed"
          mapfile -t docs < <(grep -E '\.md$' <<<"$changed" || true)
          [ ${#docs[@]} -gt 0 ] || { echo "No documents changed"; exit 0; }
          bash scripts/build.sh "${docs[@]}"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build applications
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Build documents from ${GITHUB_SHA::7}"
          git pull --rebase
          git push
