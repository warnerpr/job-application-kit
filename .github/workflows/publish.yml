name: Publish public resume

# Optional. Publishes public_resume.md as a web page to a separate public
# GitHub Pages repository. Does nothing until the PAGES_REPO variable is set.
# Setup: docs/publishing.md
on:
  push:
    branches: [main]
    paths: ['public_resume.md', 'site/**', '.github/workflows/publish.yml']
  workflow_dispatch:

jobs:
  publish:
    if: ${{ vars.PAGES_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HTML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          name="$(head -1 public_resume.md | sed 's/^# *//')"
          mkdir out
          pandoc public_resume.md -f gfm -s \
            --metadata pagetitle="$name - Resume" \
            -c style.css -o out/index.html
          cp site/style.css out/
          cp public_resume.md out/resume.md

      - name: Check out the Pages repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PAGES_REPO }}
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages

      - name: Commit and push
        run: |
          cd pages
          cp ../out/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Publish resume from ${GITHUB_SHA::7}"
          git push
